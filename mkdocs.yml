# yaml-language-server: $schema=https://squidfunk.github.io/mkdocs-material/schema.json
# =============================================================================
# Site Information — replace these placeholders per project
# =============================================================================

site_name: Homebrew Tap

site_description: >-
  Homebrew formulae for Lupaxa tools. One formula points at one tagged
  release of that tool's repository.

site_author: The Lupaxa Project

site_url: https://homebrew-tap.thelupaxaproject.org/

extra:
  generator: false
  # Desktop/tablet: no left or right column (header lists the pages).
  # Phone: primary sidebar stays in the DOM as Material's drawer.
  hide_primary_sidebar: true
  hide_secondary_sidebar: true
  # Viewer language picker (client-side translation; English URLs).
  # Default when omitted: false (picker hidden).
  language_picker: true
  # Footer (rendered by overrides/partials/copyright.html).
  footer_name: The Lupaxa Project
  footer_taglines:
    - Where exploration meets precision.
    - Where the untamed meets the engineered.
  counter_dev_id: ef410665-76d4-43fe-9e91-53f26ed1004b
  counter_dev_utcoffset: 0
  social_image: assets/images/brand/the-lupaxa-project-social-card.png
  social_image_width: 1200
  social_image_height: 630
  social_logo: assets/images/brand/the-lupaxa-project-logo.png
  social_locale: en_GB
  theme_color: "#203959"
  twitter_card: summary_large_image

# =============================================================================
# Content
# =============================================================================

docs_dir: mkdocs
site_dir: site
use_directory_urls: true

# Reload on catalogue data / build Python / hooks / CSS / JS during `mkdocs serve`.
# MkDocs watch has no globs — list directories (not tests/).
watch:
  - data
  - hooks
  - mkdocs/assets/stylesheets
  - mkdocs/assets/javascript

# =============================================================================
# Theme
# =============================================================================

theme:
  name: material
  custom_dir: overrides
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  language: en
  logo: assets/images/brand/the-lupaxa-project-logo.png
  favicon: assets/images/brand/favicon.png

  features:
    - content.code.copy
    - content.tooltips
    - navigation.indexes
    - navigation.instant
    - navigation.instant.progress
    - navigation.top
    - navigation.sections
    - toc.follow

  palette:
    scheme: slate
    primary: blue
    accent: light blue

  icon:
    repo: fontawesome/brands/github

# =============================================================================
# Plugins
# =============================================================================

plugins:
  - search

hooks:
  - hooks/asset_cache_bust.py
  - hooks/formulae_cards.py

# =============================================================================
# Navigation
# =============================================================================

nav:
  - Home: index.md
  - Formulae: formulae.md
  - Usage: usage.md
  - Sponsor: sponsor.md

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: false
      permalink_title: Link to this section
  - pymdownx.blocks.caption
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

# =============================================================================
# Additional Assets
# =============================================================================

extra_css:
  - assets/stylesheets/00-tokens.css
  - assets/stylesheets/10-base.css
  - assets/stylesheets/20-layout.css
  - assets/stylesheets/30-navigation.css
  - assets/stylesheets/40-components/buttons.css
  - assets/stylesheets/40-components/footer.css
  - assets/stylesheets/40-components/hero.css
  - assets/stylesheets/40-components/cards.css
  - assets/stylesheets/40-components/catalogue.css
  - assets/stylesheets/40-components/filter-panel.css
  - assets/stylesheets/40-components/tables.css
  - assets/stylesheets/50-pages/about.css
  - assets/stylesheets/50-pages/sponsor.css
  - assets/stylesheets/50-pages/article.css
  - assets/stylesheets/90-responsive.css
  - assets/stylesheets/95-print.css
  - assets/stylesheets/99-overrides.css

extra_javascript:
  - assets/javascript/page-lifecycle.js
  - assets/javascript/catalogue-filters.js
  - assets/javascript/language-preference.js
  - assets/javascript/header-active-nav.js

# =============================================================================
# Copyright (rendered by overrides/partials/copyright.html)
# =============================================================================
