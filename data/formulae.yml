# Formulae page cards, alphabetical by name.
# The version banner is the tag in Formula/<name>.rb.
# publish_date is when the tool repository was created.
# released_date is when the formula tag was published.
- name: brew-manager
  title: Brew Manager
  organisation: Workstation Toolbox
  logo: assets/images/organisations/organisation-workstation-toolbox-logo.png
  description: >-
    Interactive Homebrew maintenance menu for workstation brew state. Run
    common `brew` operations from a numbered menu — updates, upgrades,
    cleanup, doctor, installed package lists, and helpers for deprecated or
    disabled casks — with confirmation prompts before destructive actions.
  categories:
    - Homebrew
    - Package Management
    - Workstation
  repository: https://github.com/lupaxa-workstation-toolbox/brew-manager
  publish_date: "2026-08-01T09:46:31"
  released_date: "2026-09-30T11:52:29"

- name: check-git-repositories
  title: Check Git Repositories
  organisation: Git Toolbox
  logo: assets/images/organisations/organisation-git-toolbox-logo.png
  description: >-
    Scan a directory tree for Git repositories and report anything that is
    not fully clean and synced with its upstream — uncommitted work, unpushed
    commits, stashes, and sync drift. A single portable Bash script that
    needs only bash, find, and git. Useful as an end-of-day check across a
    workspace full of clones.
  categories:
    - Git
    - Automation
    - Repository Management
    - CLI
  repository: https://github.com/lupaxa-git-toolbox/check-git-repositories
  publish_date: "2026-08-01T09:51:27"
  released_date: "2026-09-30T08:19:19"

- name: every-repo
  title: Every Repo
  organisation: Git Toolbox
  logo: assets/images/organisations/organisation-git-toolbox-logo.png
  description: >-
    Run a command, a command file, or a script in every Git repository under a
    path. Walks a directory tree, finds each Git repository, and runs the same
    work in each one. A failure is reported, then the next repository still
    runs. Use it when the same Git or Make command needs to land in many
    checkouts.
  categories:
    - Git
    - CLI
    - Developer Tools
    - Automation
  repository: https://github.com/lupaxa-git-toolbox/every-repo
  publish_date: "2026-09-29T08:56:13"
  released_date: "2026-09-29T09:24:18"

- name: get-all-tools
  title: Get All Tools
  organisation: CI/CD Toolbox
  logo: assets/images/organisations/organisation-cicd-toolbox-logo.png
  description: >-
    Download all Lupaxa CICD Toolbox pipeline scripts into `~/bin`. A Python
    helper that fetches each tool's `src/pipeline.sh` from
    `lupaxa-cicd-toolbox` (master or latest release) and installs them as
    `cicd-<tool>` commands.
  categories:
    - CI/CD
    - CLI
    - Developer Tools
    - Automation
  repository: https://github.com/lupaxa-cicd-toolbox/get-all-tools
  publish_date: "2026-08-07T09:33:18"
  released_date: "2026-09-26T21:37:46"

