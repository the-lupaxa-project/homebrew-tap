- name: git-delete-tags
  title: Git Delete Tags
  organisation: Git Toolbox
  logo: assets/images/organisations/organisation-git-toolbox-logo.png
  description: >-
    Delete local and remote Git tags with dry-run, summary, and protection.
    Remove specific tags or clear every tag in a repository while protecting
    selected names. Useful for cleaning up stale release tags or resetting a
    tag namespace before a fresh release cycle.
  categories:
    - Git
    - Automation
    - Repository Management
    - CLI
  repository: https://github.com/lupaxa-git-toolbox/git-delete-tags
  publish_date: "2026-08-01T09:50:38"
  released_date: "2026-09-25T11:38:16"

- name: git-reset-history
  title: Git Reset History
  organisation: Git Toolbox
  logo: assets/images/organisations/organisation-git-toolbox-logo.png
  description: >-
    Rewrite a Git repository down to a single initial commit — with dry-run,
    backups, and controlled tag handling. Keeps the current tree while
    replacing primary-branch history. Useful after scaffolding, before a
    first public release, or when history is no longer useful.
  categories:
    - Automation
    - CLI
    - Git
    - Repository Management
  repository: https://github.com/lupaxa-git-toolbox/git-reset-history
  publish_date: "2026-08-01T09:49:14"
  released_date: "2026-09-25T11:40:03"

